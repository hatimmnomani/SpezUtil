name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - run: pnpm turbo run test
      - run: pnpm turbo run lint

  visual:
    runs-on: ubuntu-latest
    # Pinned identically to the @playwright/test devDependency in apps/storybook/package.json
    # (see apps/storybook/tests/visual/README.md) — a mismatch between the two means the
    # container's browser binaries don't match the npm package driving them.
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds @spezutil/storybook and every workspace package it depends on.
      - run: pnpm build --filter @spezutil/storybook...
      - run: pnpm --filter @spezutil/storybook test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storybook/playwright-report
          retention-days: 14
